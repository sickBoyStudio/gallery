name: 📸 사진 올리기
description: Git 없이 갤러리에 사진을 올려요. 운영진이 폴더에 넣어 드립니다.
title: "[사진] "
labels: ["사진"]
body:
  - type: dropdown
    id: group
    attributes:
      label: 몇 명 사진인가요
      options:
        - 4명
        - 6명
        - 기타 (설명에 적어 주세요)
    validations:
      required: true
  - type: textarea
    id: photo
    attributes:
      label: 사진
      description: 여기로 사진을 끌어다 놓으세요. 한 장에 5MB 이하.
    validations:
      required: true
  - type: input
    id: caption
    attributes:
      label: 사진 설명
      placeholder: 예) 크리스마스 출시 기념
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 찍은 날짜
      placeholder: 2026-12-24
  - type: checkboxes
    id: consent
    attributes:
      label: 확인
      options:
        - label: 사진에 나오는 모든 사람(아바타)이 공개에 동의했습니다
          required: true
        - label: 개인정보(얼굴, 학교, 위치 등)가 드러나지 않습니다
          required: true
